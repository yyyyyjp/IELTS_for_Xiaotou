name = "xiaotou-ielts"
main = "src/index.ts"
compatibility_date = "2025-02-01"
workers_dev = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "xiaotou-ielts-db"
database_id = "2782ef36-07ef-4928-8781-a9777b8f5c8b"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "xiaotou-ielts"

# 可选：通过 `npx wrangler secret put SYNC_TOKEN` 设置同步口令，不要把密钥写进此文件。
