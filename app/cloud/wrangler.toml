name = "xiaotou-ielts"
main = "src/index.ts"
compatibility_date = "2025-02-01"
workers_dev = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "xiaotou-ielts-db"
database_id = "2782ef36-07ef-4928-8781-a9777b8f5c8b"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "xiaotou-ielts"

[vars]
ADMIN_GITHUB_LOGIN = "yyyyyjp"

# 密钥全部通过 `npx wrangler secret put` 加密注入，不要把密钥写进此文件：
# - GITHUB_CLIENT_ID
# - GITHUB_CLIENT_SECRET
# - JWT_SECRET
