<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑雅18 Test3 Passage3 · 原文精读与答案核对</title>
<style>
:root{
  --bg:#EDE8DD;
  --paper:#FCFBF6;
  --paper-2:#F6F3EB;
  --ink:#23211D;
  --ink-2:#4A473F;
  --muted:#87816F;
  --line:#DFD7C6;
  --line-soft:#EDE7DA;
  --accent:#C0603C;
  --accent-hi:#D97757;
  --accent-soft:#F5E7DE;
  --good:#4A6F53;
  --good-soft:#EBF1E8;
  --good-line:#D5E3D0;
  --bad:#A34329;
  --bad-soft:#F8E7E0;
  --bad-line:#EFD3C7;
  --warn:#9A7B3C;
  --serif:"Source Serif 4","Iowan Old Style","Songti SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"kern" 1;
}
.page{max-width:1680px;margin:0 auto;padding:0 22px 26px}

/* ── 顶栏 ── */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:18px 4px 15px;
  background:linear-gradient(rgba(237,232,221,.97),rgba(237,232,221,.92));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.kicker{
  font-size:11px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--accent);font-weight:600;
}
.topbar h1{
  margin:7px 0 0;font-family:var(--serif);
  font-size:27px;font-weight:600;letter-spacing:-.012em;line-height:1.2;color:#1D1B17;
}
.topbar .sub{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.01em}
.tb-right{display:flex;align-items:center;gap:9px;flex-shrink:0;padding-bottom:3px}
.stat{
  display:flex;flex-direction:column;gap:2px;
  padding:6px 13px;border:1px solid var(--line);border-radius:8px;background:#FDFCF8;
  min-width:74px;
}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.09em}
.stat b{font-size:15px;font-family:var(--serif);font-weight:600;color:#2B2822}
.stat.bad b{color:var(--bad)}
.btn{
  appearance:none;border:1px solid #DCD5C6;background:#FDFCF8;color:var(--ink-2);
  font-family:var(--sans);font-size:12.5px;padding:9px 15px;border-radius:8px;cursor:pointer;
  transition:background .16s,border-color .16s,color .16s;white-space:nowrap;
}
.btn:hover{border-color:#C9BFA9;color:#2B2822;background:#F2EDE2}
.btn.on{background:var(--accent);border-color:var(--accent);color:#FBF7F2}
.btn.on:hover{background:var(--accent-hi);border-color:var(--accent-hi)}

/* ── 双栏 ── */
.split{
  display:grid;grid-template-columns:minmax(0,1.32fr) minmax(360px,.82fr);
  gap:20px;align-items:start;
}
.pane{
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  height:calc(100vh - 132px);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 1px 0 rgba(60,50,35,.02),0 14px 34px -30px rgba(60,50,35,.5);
}
.pane-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px;border-bottom:1px solid var(--line-soft);
  font-size:11px;font-weight:600;letter-spacing:.12em;color:#6E6857;
  background:var(--paper-2);
  flex-shrink:0;text-transform:uppercase;
}
.pane-head .hint{
  font-weight:400;letter-spacing:0;color:#9A9384;font-size:11.5px;text-align:right;
  text-transform:none;
}
.scroll{overflow-y:auto;overscroll-behavior:contain;padding:16px 30px 60px;flex:1}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#DCD5C5;border-radius:6px;border:3px solid var(--paper)}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ── 原文 ── */
.para{
  position:relative;margin:0 0 4px;padding:12px 0 12px 40px;
  border-radius:8px;transition:background .2s;
}
.para:hover{background:#FCFAF4}
.para + .para{border-top:1px dashed #E9E3D5}
.pnum{
  position:absolute;left:4px;top:14px;
  width:24px;height:24px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#A9603F;
  background:#F3E9DF;font-family:var(--sans);
}
.text{
  font-family:var(--serif);font-size:17.5px;line-height:1.95;color:#26241F;
  letter-spacing:.002em;
}
.sent{
  cursor:pointer;border-radius:3px;
  transition:background .14s;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.sent:hover{background:#F1EADC}
.sent.open{background:#FAF0DA;box-shadow:0 0 0 2px #FAF0DA}
.w{border-radius:2px;transition:background .1s,color .1s}
.w:hover{background:var(--accent);color:#FCF8F3;cursor:help}
.tr{
  display:none;
  margin:10px 0;padding:9px 14px;
  font-family:var(--sans);font-size:13.5px;line-height:1.9;color:#5B564B;
  background:#F6F2E8;border-left:2px solid #D9A184;border-radius:0 5px 5px 0;
}
.tr.show{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* ── 答案栏 ── */
.ans-wrap{padding:18px 18px 60px}
.sect{margin-bottom:22px}
.sect-t{
  display:flex;align-items:center;gap:9px;margin:0 0 10px;
  font-size:11px;letter-spacing:.14em;color:#8C8577;font-weight:600;
}
.sect-t::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.sect-desc{font-size:11.5px;color:#9A9384;line-height:1.65;margin:-3px 0 11px}
.qcard{
  border:1px solid #E6E1D4;border-radius:10px;padding:13px 14px;margin-bottom:9px;
  background:#FEFDF9;transition:border-color .16s,box-shadow .16s;
}
.qcard:hover{border-color:#D7CFBC;box-shadow:0 8px 22px -20px rgba(60,50,35,.6)}
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.qno{
  font-family:var(--serif);font-size:13px;font-weight:600;
  min-width:26px;height:22px;padding:0 6px;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#F1EDE2;color:#6E6857;
}
.qcard.ok .qno{background:var(--good-soft);color:var(--good)}
.qcard.no .qno{background:var(--bad-soft);color:var(--bad)}
.tag{
  font-size:10px;letter-spacing:.08em;padding:2px 7px;border-radius:3px;font-weight:600;
}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.stem{
  margin:0 0 9px;line-height:1.68;color:#2E2B25;
  font-family:var(--serif);font-size:15px;
}
.opts{list-style:none;margin:0;padding:0}
.opt{
  display:flex;gap:8px;padding:5px 24px 5px 9px;border-radius:5px;font-size:13px;line-height:1.62;
  color:#544F44;border:1px solid transparent;align-items:flex-start;position:relative;
}
.opt i{
  font-style:normal;font-weight:600;color:#A69E8D;width:13px;flex-shrink:0;
  font-family:var(--serif);
}
.opt span{flex:1}
.mk{position:absolute;right:8px;top:4px;font-size:11px;font-weight:700;line-height:1.8}
.opt.correct{background:var(--good-soft);color:#3D5C44;border-color:var(--good-line)}
.opt.correct i{color:var(--good)}
.opt.correct .mk{color:var(--good)}
.opt.mine-wrong{background:var(--bad-soft);color:#8E3A26;border-color:var(--bad-line)}
.opt.mine-wrong i{color:var(--bad)}
.opt.mine-wrong .mk{color:var(--bad)}
.ansline{
  margin-top:9px;padding-top:8px;border-top:1px dashed var(--line-soft);
  font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center;
}
.ansline b{font-family:var(--serif);font-size:13px}
.ansline .good{color:var(--good)}
.ansline .bad{color:var(--bad)}

/* 摘要填空 */
.sum-box{
  border:1px solid #E6E1D4;border-radius:10px;padding:14px 15px;background:#FEFDF9;
}
.sum-t{
  font-family:var(--serif);font-size:14.5px;font-weight:600;margin:0 0 9px;color:#2B2822;
}
.sum-text{font-family:var(--serif);font-size:14.8px;line-height:2.15;color:#282520}
.blank{
  display:inline-flex;align-items:baseline;gap:4px;margin:0 1px;
  padding:1px 5px;border-radius:4px;font-family:var(--sans);font-size:12.5px;
  font-weight:600;white-space:nowrap;
}
.blank.ok{background:var(--good-soft);color:var(--good);border:1px solid var(--good-line)}
.blank.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.blank b{font-size:10px;opacity:.72;font-weight:600}
.blank .arrow{opacity:.5;font-weight:400;margin:0 1px}
.optbox{
  margin-top:12px;border-top:1px dashed var(--line-soft);padding-top:11px;
  display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;
}
.optbox div{font-size:12.4px;color:#544F44;line-height:1.78;display:flex;gap:6px}
.optbox em{font-style:normal;font-weight:700;color:#A69E8D;font-family:var(--serif);width:12px;flex-shrink:0}
.optbox div.hit{color:var(--good);font-weight:600}
.optbox div.hit em{color:var(--good)}
.optbox div.mis{color:var(--bad);text-decoration:line-through;text-decoration-color:#E0B5A5}
.optbox div.mis em{color:var(--bad)}

/* YNNG */
.ynrow{display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap}
.chip{
  font-family:var(--serif);font-size:12px;font-weight:600;
  padding:2px 9px;border-radius:4px;letter-spacing:.03em;
}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.no{background:var(--bad-soft);color:var(--bad)}
.chip.neu{background:#F1EDE2;color:#6E6857}
.chip-lbl{font-size:10.5px;color:#9A9384;letter-spacing:.05em}

/* 概览 */
.overview{
  border:1px solid #E6E1D4;border-radius:10px;padding:13px 15px;margin-bottom:18px;
  background:linear-gradient(180deg,#FAF7F0,#FEFDF9);
}
.ov-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:#544F44}
.ov-row b{font-family:var(--serif);font-size:13.5px;color:#2B2822}
.ov-wrong{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-soft);font-size:12px;color:#9A9384}
.ov-wrong span{
  display:inline-block;font-family:var(--serif);font-size:12px;font-weight:600;color:var(--bad);
  background:var(--bad-soft);border-radius:3px;padding:1px 6px;margin:3px 4px 0 0;
}

/* tooltip */
.tip{
  position:fixed;z-index:100;pointer-events:none;opacity:0;
  background:#26241F;color:#F7F3EA;border-radius:7px;
  padding:7px 11px 9px;font-size:12.5px;line-height:1.6;max-width:330px;min-width:176px;
  box-shadow:0 12px 30px -10px rgba(30,25,18,.5);
  transform:translateY(3px);transition:opacity .12s,transform .12s;
}
.tip.show{opacity:1;transform:none;pointer-events:auto}
.tip .tw{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.01em}
.tip .tp{color:#E0A98D;font-size:11px;margin-left:5px}
.tip .tg{color:#DCD5C6;margin-top:3px;font-size:12.5px}


/* ── 可点开的题卡 ── */
.sect-t .sect-tip{order:2;margin-left:8px;font-size:10px;font-weight:400;letter-spacing:0;color:#A79E8C;white-space:nowrap}
.sect-t::after{order:1}
.qclick{cursor:pointer}
.qmore{margin-left:auto;font-size:10.5px;color:var(--accent);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.qmore i{font-style:normal;font-size:10.5px;line-height:1;opacity:.85;transition:transform .2s}
.qcard.open{border-color:#DCC9B4;background:#FEFCF6}
.qcard.open .qmore i{transform:rotate(180deg)}
.qrev{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line-soft)}
.qcard.open .qrev{display:block;animation:qfade .18s ease-out}
@keyframes qfade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.qrev-d,.qrev-c{margin:0;font-size:12.7px;line-height:1.9;color:#4E4941}
.qrev-c{margin-top:9px}
.qrev-d b,.qrev-c b{
  display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  color:#8A6A4E;background:#F6EEE2;border:1px solid #EADCC8;border-radius:3px;
  padding:0 5px;margin-right:6px;vertical-align:1px;
}
.qrev-c b{color:#4F6B4A;background:#EDF3EA;border-color:#D8E5D3}
.sum-rev{display:none;margin:11px 0 0;padding:11px 0 0;border-top:1px dashed var(--line-soft)}
.sum-rev.open{display:block;animation:qfade .18s ease-out}
.sum-rev .qrev{display:block;margin:0;padding:0;border:0}
.blank{cursor:pointer;transition:box-shadow .14s}
.blank:hover{box-shadow:0 0 0 2px #E7D8C2}
.blank.on{box-shadow:0 0 0 2px #D9A184}
.note-grp{
  margin:12px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;
  background:#FBF7EE;font-size:11.8px;line-height:1.82;color:#6E6857;
}
.note-grp b{display:inline-block;font-size:10px;letter-spacing:.06em;color:#9A7B5A;
  border:1px solid #E7D9C4;background:#F6EEE2;border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:1px}
.note-grp em{font-style:normal;background:#F3E7D3;border-radius:3px;padding:0 3px}

/* 左栏标注 */
.sent.hl{background:#F8E4C4;box-shadow:0 0 0 2px #F8E4C4;font-weight:600;color:#1B1913}
.sent.hl:hover{background:#F2D6AC;box-shadow:0 0 0 2px #F2D6AC}
.cite-j{
  display:inline-block;margin:9px 0 0;cursor:pointer;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;color:#9C8460;
  transition:color .14s;
}
.cite-j:hover{color:var(--accent);text-decoration:underline}
.cite-j em{font-style:normal;color:#B7AC95}
.para.has-hl .pnum{background:var(--accent);color:#FCF8F2}

@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .pane{height:auto;max-height:none}
  .scroll{padding:8px 18px 40px}
  .topbar{flex-direction:column;align-items:flex-start}
  .text{font-size:17px}
}

/* ── 视图切换 ── */
[hidden]{display:none!important}
.tabs{display:inline-flex;gap:2px;margin-top:12px;padding:3px;background:#E7E1D2;border-radius:9px}
.tab{
  appearance:none;border:0;background:transparent;color:#6E6857;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;padding:6px 15px;border-radius:7px;
  transition:background .15s,color .15s;
}
.tab:hover{color:#2B2822}
.tab.on{background:#FEFCF7;color:#A9552F;font-weight:600;box-shadow:0 1px 2px rgba(60,50,35,.14)}

/* ── 复盘 ── */
.rev{max-width:1080px;margin:0 auto;padding:30px 0 90px}
.rev-k{
  font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--accent);font-weight:600;
}
.rev h2{
  font-family:var(--serif);font-size:31px;line-height:1.32;font-weight:600;color:#1D1B17;
  margin:9px 0 0;letter-spacing:-.012em;
}
.rev-lede{
  font-size:14.5px;line-height:1.95;color:#4E4941;margin:14px 0 0;max-width:820px;
}
.rev-lede b{color:#23211D;font-weight:600;background:linear-gradient(180deg,transparent 62%,#F5E2CC 62%)}
.rev-stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.rs{
  flex:1;min-width:120px;background:#FCFBF6;border:1px solid #E4DECD;border-radius:10px;
  padding:11px 14px;
}
.rs span{display:block;font-size:10.5px;letter-spacing:.1em;color:#948C7B}
.rs b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;color:#2B2822;margin-top:3px}
.rs.bad b{color:var(--bad)}

.bars{margin-top:16px;background:#FCFBF6;border:1px solid #E4DECD;border-radius:10px;padding:14px 16px}
.bar{display:flex;align-items:center;gap:12px;padding:5px 0;font-size:12.5px;color:#544F44}
.bar .bl{width:118px;flex-shrink:0;color:#6E6857}
.bar .track{flex:1;height:7px;background:#EDE7D9;border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#D9A184,#C0603C)}
.bar .v{width:44px;text-align:right;font-family:var(--serif);font-weight:600;color:#2B2822}

.sec-h{
  display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;
  padding-bottom:9px;border-bottom:1px solid var(--line);
}
.sec-h h3{
  margin:0;font-family:var(--serif);font-size:17.5px;font-weight:600;color:#23211D;letter-spacing:-.005em;
}
.sec-h em{
  font-style:normal;font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:600;
}
.sec-h .cnt{margin-left:auto;font-size:11.5px;color:#948C7B}

.rc{
  background:#FEFDF9;border:1px solid #E4DECD;border-radius:11px;
  padding:16px 18px;margin-bottom:13px;
}
.rc-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.rc-no{
  font-family:var(--serif);font-size:13px;font-weight:600;color:#8E3A26;background:var(--bad-soft);
  border-radius:4px;padding:2px 8px;
}
.rc-no.ok{color:var(--good);background:var(--good-soft)}
.rc-tag{font-size:10.5px;letter-spacing:.08em;color:#948C7B;border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.rc-v{margin-left:auto;font-family:var(--serif);font-size:13px;color:#6E6857}
.rc-v b{font-weight:600}
.rc-v .x{color:var(--bad)}
.rc-v .o{color:var(--good)}
.rc-q{font-family:var(--serif);font-size:15.5px;line-height:1.62;color:#2E2B25;margin:0 0 11px}
.rc-diag,.rc-chain{font-size:13.6px;line-height:1.92;color:#4E4941;margin:11px 0 0}
.rc-diag b,.rc-chain b{
  display:inline-block;font-size:11px;letter-spacing:.08em;color:#A9552F;
  border:1px solid #EBD6C4;background:#FAEEE4;border-radius:3px;padding:1px 6px;margin-right:7px;
  vertical-align:1px;
}
.rc-chain b{color:var(--good);border-color:#D8E5D3;background:#EDF3EA}
.rc em{font-style:normal;background:#F6EEDF;border-radius:3px;padding:0 3px;font-family:var(--serif);font-size:13.8px}

/* 摘要表格 */
.tbl{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
.tbl th{
  text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.1em;color:#948C7B;
  padding:0 8px 7px;border-bottom:1px solid var(--line);text-transform:uppercase;
}
.tbl td{padding:7px 8px;border-bottom:1px dashed var(--line-soft);color:#4E4941;line-height:1.65}
.tbl td:first-child{font-family:var(--serif);font-weight:600;color:#6E6857;width:42px}
.tbl td.mk-c{color:var(--good);font-weight:600}
.tbl td.mk-x{color:var(--bad);font-weight:600}
.tbl td.mk-x s{color:#A34329;opacity:.75}
.tbl .ph{font-family:var(--serif);font-size:13.4px}
.tbl tr:last-child td{border-bottom:0}

/* 判断题行 */
.yn{
  display:grid;grid-template-columns:38px 1fr;gap:10px 12px;
  padding:11px 0;border-bottom:1px dashed var(--line-soft);
}
.yn:last-child{border-bottom:0}
.yn-n{font-family:var(--serif);font-size:13px;font-weight:600;color:#6E6857;padding-top:1px}
.yn-q{font-family:var(--serif);font-size:14.6px;line-height:1.6;color:#2E2B25;margin:0 0 6px}
.yn-j{font-size:13.2px;line-height:1.85;color:#4E4941;margin:0}
.yn-a{display:flex;gap:7px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.chip2{font-family:var(--serif);font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:4px}
.chip2.x{background:var(--bad-soft);color:var(--bad)}
.chip2.o{background:var(--good-soft);color:var(--good)}
.chip2.n{background:#F1EDE2;color:#6E6857}

/* 病灶 & 行动 */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dg{background:#FCFBF6;border:1px solid #E4DECD;border-radius:11px;padding:15px 16px}
.dg .t{font-family:var(--serif);font-size:15px;font-weight:600;color:#23211D;margin:0 0 6px}
.dg .n{font-size:10.5px;letter-spacing:.1em;color:var(--accent);font-weight:600;margin-bottom:7px}
.dg p{font-size:13px;line-height:1.88;color:#4E4941;margin:0}
.dg p em{font-style:normal;background:#F6EEDF;border-radius:3px;padding:0 3px;font-family:var(--serif)}

.acts{counter-reset:a;margin:0;padding:0;list-style:none}
.acts li{
  position:relative;padding:10px 0 10px 38px;font-size:13.7px;line-height:1.9;color:#4E4941;
  border-bottom:1px dashed var(--line-soft);
}
.acts li:last-child{border-bottom:0}
.acts li::before{
  counter-increment:a;content:counter(a);
  position:absolute;left:0;top:11px;width:21px;height:21px;border-radius:5px;
  background:#F1EADF;color:#A9552F;font-family:var(--serif);font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.acts b{color:#23211D;font-weight:600}
.acts em{font-style:normal;font-family:var(--serif);background:#F6EEDF;border-radius:3px;padding:0 3px}

.rev-end{
  margin-top:34px;padding:18px 20px;border:1px solid #EAD8C6;background:#FAF1E7;border-radius:11px;
  font-family:var(--serif);font-size:16px;line-height:1.8;color:#6B4630;
}
.rev-end b{color:#8E3A26}

.note-ok{
  margin:2px 0 4px;padding:12px 16px;border:1px dashed #D5E0CF;background:#F1F5EE;
  border-radius:9px;font-size:13.4px;line-height:1.92;color:#41533F;
}
.note-ok b{
  display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--good);
  border:1px solid #D5E3D0;background:#E9F1E5;border-radius:3px;padding:1px 6px;margin-right:7px;
  vertical-align:1px;
}

.mn-thesis{
  margin:22px 0 4px;padding:17px 21px;background:#FCFBF6;border:1px solid #E4DECD;
  border-left:3px solid var(--accent);border-radius:3px 11px 11px 3px;
}
.mn-thesis em{
  display:block;font-style:normal;font-size:10.5px;letter-spacing:.14em;
  color:var(--accent);font-weight:600;margin-bottom:7px;
}
.mn-thesis p{
  margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.8;color:#2A2721;
}
.mn-band{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.mn-cell{border-radius:8px;padding:9px 5px 10px;text-align:center;border:1px solid transparent}
.mn-cell b{display:block;font-size:13px;font-weight:600;line-height:1.2;letter-spacing:.02em}
.mn-cell span{display:block;font-size:11px;margin-top:5px;line-height:1.35}
.mn-cell.t{background:#EAF1E7;border-color:#C9DCC3;color:#3C5A44}
.mn-cell.t b{color:#2F4A36}
.mn-cell.a{background:#F8EEDF;border-color:#E7D3B4;color:#7A5320}
.mn-cell.a b{color:#6B4611}
.mn-cell.g{background:#F1EFE8;border-color:#DEDAD0;color:#5F5A4E}
.mn-cell.g b{color:#4A473F}
.mn-legend{display:flex;gap:18px;margin-top:11px;font-size:11.5px;color:#8A8474;flex-wrap:wrap}
.mn-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.mn-duel{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start}
.mn-col{background:#FCFBF6;border:1px solid #E4DECD;border-radius:11px;padding:15px 17px}
.mn-col.neg{border-color:#E7D3B4;background:#FBF6ED}
.mn-col.pos{border-color:#CBDDC5;background:#F6F9F3}
.mn-col h4{
  margin:0 0 11px;font-size:11px;letter-spacing:.1em;font-weight:600;
  display:flex;align-items:center;gap:7px;
}
.mn-col.neg h4{color:#8A5C1E}
.mn-col.pos h4{color:#3F5C46}
.mn-col ol{margin:0;padding:0;list-style:none;counter-reset:m}
.mn-col li{
  counter-increment:m;position:relative;padding-left:23px;
  font-size:13.2px;line-height:1.86;color:#46423A;margin-bottom:10px;
}
.mn-col li:last-child{margin-bottom:0}
.mn-col li::before{
  content:counter(m);position:absolute;left:0;top:4px;
  width:15px;height:15px;border-radius:50%;font-size:10px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.mn-col.neg li::before{background:#F0DFC6;color:#7A5320}
.mn-col.pos li::before{background:#DCE9D6;color:#3A5741}
.mn-col li b{font-weight:600;color:#2A2721}
.mn-col li em{font-style:normal;font-family:var(--serif);background:#F2EBDB;border-radius:3px;padding:0 3px}
.mn-punch{
  margin-top:13px;padding:12px 18px;background:#23211D;color:#F3EEE2;
  border-radius:9px;font-family:var(--serif);font-size:14.5px;line-height:1.72;
}
.mn-punch b{color:#F0C79A;font-weight:600}
.mn-tbl{background:#FCFBF6;border:1px solid #E4DECD;border-radius:11px;overflow:hidden}
.mn-row{
  display:grid;grid-template-columns:46px 1fr 64px;gap:13px;
  padding:11px 16px;border-bottom:1px solid #EFE9DB;align-items:start;
}
.mn-row:last-child{border-bottom:none}
.mn-row:nth-child(even){background:#FAF8F2}
.mn-row .n{font-family:var(--serif);font-size:13.5px;color:#9A9382;font-weight:600;padding-top:2px}
.mn-row .d{font-size:13.2px;line-height:1.86;color:#46423A}
.mn-row .d em{font-style:normal;font-family:var(--serif);background:#F4EDDF;border-radius:3px;padding:0 3px}
.mn-row .w{
  font-size:11px;text-align:center;padding:2px 0;border-radius:4px;
  font-weight:500;margin-top:1px;
}
.mn-row .w.t{background:#EAF1E7;color:#3C5A44}
.mn-row .w.a{background:#F8EEDF;color:#7A5320}
.mn-row .w.g{background:#F1EFE8;color:#5F5A4E}
.mn-terms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mn-term{background:#FCFBF6;border:1px solid #E4DECD;border-radius:11px;padding:15px 16px}
.mn-term b{display:block;font-family:var(--serif);font-size:16px;color:#23211D;font-weight:600}
.mn-term i{display:block;font-style:normal;font-size:11px;color:#9A9382;margin:3px 0 9px;letter-spacing:.02em}
.mn-term p{margin:0;font-size:13px;line-height:1.86;color:#4E4941}
.mn-term p em{font-style:normal;background:#F6EEDF;border-radius:3px;padding:0 3px;font-family:var(--serif)}
.mn-echo{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.mn-q{
  margin:0;font-family:var(--serif);font-size:13.6px;line-height:1.9;
  color:#46423A;border-left:2px solid #E2D6BE;padding-left:12px;
}
.mn-col.pos .mn-q{border-left-color:#CBDDC5}
.mn-q b{font-weight:600;color:#23211D;background:linear-gradient(180deg,transparent 64%,#EFE1CB 64%)}
.mn-col.pos .mn-q b{background:linear-gradient(180deg,transparent 64%,#DCEBD5 64%)}
.mn-echo-note{margin-top:11px;font-size:12.8px;line-height:1.9;color:#7A7466}
.mn-echo-note b{color:#2A2721;font-weight:600}
.mn-why{background:#FCFBF6;border:1px solid #E4DECD;border-radius:11px;padding:2px 19px}
.mn-why > div{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #EFE9DB}
.mn-why > div:last-child{border-bottom:none}
.mn-why .k{font-family:var(--serif);font-size:15px;color:var(--accent);font-weight:600;line-height:1.55}
.mn-why .v{font-size:13.2px;line-height:1.9;color:#46423A}
.mn-why .v b{display:block;font-weight:600;color:#2A2721;margin-bottom:2px}
.mn-why .v em{font-style:normal;font-family:var(--serif);background:#F4EDDF;border-radius:3px;padding:0 3px}
.mn-side{
  margin-top:15px;padding:15px 18px;background:#F7F4EC;border:1px dashed #DCD3BF;
  border-radius:9px;font-size:13.2px;line-height:1.92;color:#4A463D;
}
.mn-side b{color:#2A2721;font-weight:600}

/* ── 复盘并入右栏 ── */
.pane-ans .ans-wrap{padding-bottom:8px}
.rev-in{max-width:none;margin:0;padding:0 18px 70px}
.rev-sep{display:flex;align-items:center;margin:24px 0 13px}
.rev-sep::before,.rev-sep::after{content:"";height:1px;background:var(--line);flex:1}
.rev-sep span{padding:0 11px;font-size:10.5px;letter-spacing:.17em;font-weight:700;color:var(--accent);white-space:nowrap}
.rev-in h2{font-size:19px;line-height:1.45;margin:0 0 8px}
.rev-in .rev-lede{font-size:13.2px;line-height:1.95;margin:0 0 14px}
.rev-in .bars{margin-top:14px;gap:7px}
.rev-in .bar{font-size:11.5px}
.rev-in .bar .bl{width:84px;flex:0 0 84px}
.rev-in .sec-h{margin:26px 0 10px}
.rev-in .sec-h em{font-size:9.6px;letter-spacing:.14em}
.rev-in .sec-h h3{font-size:15px;line-height:1.5}
.rev-in .sec-h .cnt{font-size:11px}
.rev-in .rc{padding:13px 14px;border-radius:9px}
.rev-in .rc-h{gap:7px;margin-bottom:8px}
.rev-in .rc-v{flex:0 0 100%;width:100%;margin-left:0;order:9;font-size:12.4px;padding-top:1px}
.rev-in .rc-q{font-size:14px;line-height:1.66;margin-bottom:9px}
.rev-in .rc-diag,.rev-in .rc-chain{font-size:12.7px;line-height:1.92;margin-top:10px}
.rev-in .rc em{font-size:13px}
.rev-in .cite-j{font-size:12px;margin-top:10px}
.rev-in .grid3{grid-template-columns:1fr;gap:9px}
.rev-in .dg{padding:12px 14px}
.rev-in .dg p{margin-top:6px}
.rev-in .acts{padding-left:22px;margin-top:2px}
.rev-in .acts li{font-size:12.7px;line-height:1.9;margin-bottom:10px}
.rev-in .yn{gap:9px;padding:11px 0}
.rev-in .yn-q{font-size:12.9px;line-height:1.72}
.rev-in .yn-j{font-size:12.4px;line-height:1.88}
.rev-in .note-ok{font-size:12.6px;line-height:1.9;padding:11px 13px}
.rev-in .rev-end{font-size:12.7px;padding:14px 15px;margin-top:16px}

/* 摘要竖排 */
.srows{display:flex;flex-direction:column;margin:4px 0 12px;border-top:1px solid var(--line-soft)}
.srow{padding:9px 1px 8px;border-bottom:1px dashed var(--line-soft)}
.srow-h{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:12.7px;line-height:1.72}
.sno{font-family:var(--serif);font-weight:600;color:#8C8473;min-width:17px;font-size:12.5px}
.smark{font-weight:700;font-size:11.5px;line-height:1}
.srow.ok .smark{color:var(--good)}
.srow.no .smark{color:var(--bad)}
.sv-o,.sv-x{font-weight:600}
.sv-o{color:var(--good)}
.sv-x{color:var(--bad)}
.sv-o i,.sv-x i{font-style:normal;font-weight:400;font-family:var(--serif);font-size:12.3px;color:#6E6857}
.arw{color:#B3AB9A;font-size:11px;padding:0 1px}
.srow-s{font-size:11.4px;line-height:1.6;color:#948C7B;margin:4px 0 0 23px;font-family:var(--serif)}

.ph-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.jump{font-style:normal;cursor:pointer;letter-spacing:0;white-space:nowrap;
  font-size:10.5px;font-weight:500;color:var(--accent);
  border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 9px}
.jump:hover{color:var(--accent-hi);border-color:#DCC9B4;background:#FBF3E8}
.jump:hover{color:var(--accent-hi);text-decoration:underline;text-underline-offset:2px}

@media (max-width:1100px){
  .rev-in{max-width:820px;margin:0 auto;padding:0 18px 40px}
  .ans-wrap .qrev-d,.ans-wrap .qrev-c{max-width:740px}
  .sect-t .sect-tip{display:none}
  .rev-in h2{font-size:22px;margin-top:2px}
  .rev-in .rev-lede{font-size:14px}
  .rev-in .sec-h h3{font-size:16.5px}
  .rev-in .rc{padding:16px 18px}
  .rev-in .rc-q{font-size:15px}
  .rev-in .rc-diag,.rev-in .rc-chain{font-size:13.4px}
  .rev-in .rc-v{flex:0 0 auto;width:auto;margin-left:auto;order:0;font-size:13px}
  .rev-in .cite-j{font-size:12.4px}
  .rev-in .grid3{grid-template-columns:repeat(3,1fr)}
  .rev-in .acts li{font-size:13.2px}
  .rev-in .srow-h{font-size:13.2px}
}
@media (max-width:900px){
  .grid3{grid-template-columns:1fr}
  .rev h2{font-size:24px}
  .bar .bl{width:96px}
}


@media (max-width:900px){
  .mn-band{grid-template-columns:repeat(4,1fr);gap:4px}
  .mn-duel,.mn-echo,.mn-terms{grid-template-columns:1fr}
  .mn-row{grid-template-columns:38px 1fr 58px;gap:9px;padding:10px 13px}
  .mn-thesis p{font-size:15.5px}
}

/* ══════════ 生词本（本地临时存储版） ══════════ */
.vb-badge{
  display:inline-block;margin-left:6px;padding:0 5px;min-width:16px;text-align:center;
  border-radius:999px;background:var(--accent);color:#FCF8F3;
  font-family:var(--serif);font-size:10.5px;font-weight:600;line-height:15px;vertical-align:1px;
  font-style:normal;
}
.vb-badge.zero{display:none}
.btn.on .vb-badge{background:#FCF8F3;color:var(--accent)}

/* 原文中已收录的词 */
.w.saved{background:#F6E3D2;box-shadow:inset 0 -1.5px 0 #CB7A52;border-radius:2px}
.w.saved:hover{background:var(--accent);box-shadow:none;color:#FCF8F3}

/* tooltip 内的收词按钮 */
.tip-save{
  display:block;width:100%;margin-top:8px;appearance:none;cursor:pointer;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;text-align:center;
  padding:5px 8px;border-radius:5px;border:1px solid #50493D;background:#332F27;color:#E9D8C6;
  transition:background .14s,color .14s,border-color .14s;
}
.tip-save:hover{background:#3E382E;color:#FFF6EB;border-color:#7A6E5B}
.tip-save.on{background:#2C3A2F;border-color:#4E6553;color:#C6DCC0}
.tip-save.on:hover{background:#334537;color:#DCEBD5}

/* 抽屉 */
.vb-mask{
  position:fixed;inset:0;z-index:110;background:rgba(35,29,22,.26);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.vb-mask.open{opacity:1;pointer-events:auto}
.vb-drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:120;width:396px;max-width:94vw;
  display:flex;flex-direction:column;
  background:var(--paper);border-left:1px solid var(--line);
  box-shadow:-30px 0 70px -46px rgba(40,32,22,.75);
  transform:translateX(101%);transition:transform .28s cubic-bezier(.22,.72,.24,1);
}
.vb-drawer.open{transform:none}
.vb-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:15px 18px 12px;border-bottom:1px solid var(--line-soft);background:var(--paper-2);
}
.vb-k{font-size:10px;letter-spacing:.19em;color:var(--accent);font-weight:600;text-transform:uppercase}
.vb-head h3{margin:5px 0 0;font-family:var(--serif);font-size:19px;font-weight:600;color:#1D1B17}
.vb-head h3 span{font-size:11.5px;color:#9A9384;font-weight:400;font-family:var(--sans);margin-left:6px}
.vb-x{
  appearance:none;border:1px solid var(--line);background:#FDFCF8;color:#6E6857;
  width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;
  font-family:var(--sans);flex-shrink:0;
}
.vb-x:hover{background:#F2EDE2;color:#2B2822}
.vb-tools{
  padding:11px 18px 10px;border-bottom:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:8px;
}
.vb-search{
  width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;
  background:#FDFCF8;font-family:var(--sans);font-size:12.5px;color:#2B2822;outline:none;
}
.vb-search:focus{border-color:#C9BFA9;background:#FFFDF9}
.vb-btns{display:flex;gap:6px}
.vb-btns .btn{flex:1;padding:5px 0;font-size:11.5px;border-radius:6px;text-align:center}
.vb-btns .btn.danger{color:#A34329;border-color:#EFD3C7;background:#FBF0EB}
.vb-btns .btn.danger:hover{background:#F8E3DA;border-color:#E5BFAF}
.vb-list{flex:1;overflow-y:auto;padding:12px 16px 24px;overscroll-behavior:contain}
.vb-list::-webkit-scrollbar{width:9px}
.vb-list::-webkit-scrollbar-thumb{background:#DCD5C5;border-radius:6px;border:3px solid var(--paper)}
.vb-item{
  position:relative;border:1px solid #E6E1D4;border-radius:9px;background:#FEFDF9;
  padding:10px 12px;margin-bottom:8px;
}
.vb-item .wd{font-family:var(--serif);font-size:15.5px;font-weight:600;color:#23211D;letter-spacing:.01em}
.vb-item .lm{font-size:10.5px;color:#A79E8C;margin-left:6px;font-family:var(--sans)}
.vb-item .df{font-size:12.2px;line-height:1.75;color:#4E4941;margin-top:4px}
.vb-item .cx{
  font-family:var(--serif);font-size:11.9px;line-height:1.72;color:#6E6857;
  margin-top:8px;padding:1px 0 1px 8px;border-left:2px solid #E7D9C4;
}
.vb-item .cx b{font-weight:600;color:#A9552F;background:#F7E9DC;border-radius:2px;padding:0 2px}
.vb-item .ft{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:10.5px;color:#A79E8C;flex-wrap:wrap}
.vb-item .ft .src{color:#9A9384}
.vb-item .del{
  margin-left:auto;appearance:none;border:1px solid transparent;background:transparent;
  color:#B0A794;font-size:11px;cursor:pointer;padding:1px 5px;border-radius:4px;
  font-family:var(--sans);
}
.vb-item .del:hover{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-line)}
.vb-empty{padding:46px 14px;text-align:center;font-size:12.5px;line-height:1.95;color:#A79E8C}
.vb-empty b{display:block;font-family:var(--serif);font-size:15px;color:#6E6857;font-weight:600;margin-bottom:5px}
.vb-foot{
  padding:10px 18px 14px;border-top:1px solid var(--line-soft);
  font-size:10.8px;line-height:1.7;color:#A79E8C;background:#FBF8F1;
}
.vb-foot b{color:var(--bad);font-weight:600}

/* 轻提示 */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,8px);z-index:200;
  background:#26241F;color:#F7F3EA;border-radius:999px;padding:7px 16px;
  font-family:var(--sans);font-size:12.5px;box-shadow:0 16px 34px -18px rgba(30,25,18,.6);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:520px){
  .vb-drawer{width:100vw;max-width:100vw}
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
      <div class="tabs" id="tabs"><button class="tab on" data-v="read">精读对照</button><button class="tab" data-v="means">读懂这篇</button></div>
    </div>
    <div class="tb-right">
      <div class="stat"><span>用时</span><b id="dur"></b></div>
      <div class="stat bad"><span>得分</span><b id="score"></b></div>
      <button class="btn" id="btnVocab">生词本<i class="vb-badge zero" id="vbCountTop">0</i></button>
      <button class="btn" id="btnAll">展开全部译文</button>
    </div>
  </header>

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function wordHTML(w){
  return '<span class="w">' + esc(w) + '</span>';
}
function tokenize(sentence){
  // 单词（含撇号/连字符）| 空白 | 其它（标点、引号、破折号）
  const re = /([A-Za-z0-9](?:[A-Za-z0-9'\u2019\-]*[A-Za-z0-9])?)|(\s+)|([^A-Za-z0-9\s]+)/g;
  let out = '', m;
  while ((m = re.exec(sentence)) !== null){
    if (m[1]) out += wordHTML(m[1]);
    else out += esc(m[0]);
  }
  return out;
}

/* ---------- 单词悬停释义 ---------- */
const tip = document.getElementById('tip');
function lookup(raw){
  const lw = raw.toLowerCase();
  const cands = [lw];
  if (lw.endsWith("'s") || lw.endsWith('\u2019s')) cands.push(lw.slice(0,-2));
  if (lw.endsWith("s'")) cands.push(lw.slice(0,-1));
  if (lw.endsWith("n't")) cands.push(lw.replace(/n't$/,''));
  cands.push(lw.replace(/ies$/,'y'), lw.replace(/es$/,''), lw.replace(/s$/,''),
             lw.replace(/ed$/,''), lw.replace(/ed$/,'e'), lw.replace(/ing$/,''),
             lw.replace(/ing$/,'e'), lw.replace(/([a-z])\1(ed|ing)$/,'$1'));
  for (const c of cands) if (DICT[c]) return [c, DICT[c]];
  return null;
}
/* ══════════ 生词本 · 本地临时存储 ══════════ */
const VOCAB_KEY = 'wb_vocab_v1';
const SRC = [DATA.meta.book, DATA.meta.test, DATA.meta.passage].filter(Boolean).join(' · ');
let vocab = [];
let vocabMemOnly = false;

function vocabLoad(){
  try{
    const raw = localStorage.getItem(VOCAB_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    vocab = Array.isArray(arr) ? arr.filter(v => v && v.lemma && v.word) : [];
  }catch(e){
    vocab = []; vocabMemOnly = true;
  }
}
function vocabSave(){
  try{ localStorage.setItem(VOCAB_KEY, JSON.stringify(vocab)); }
  catch(e){ vocabMemOnly = true; }
}
function vocabFind(lemma){ return vocab.find(v => v.lemma === lemma && v.src === SRC); }
function vocabSavedSet(){
  const s = new Set();
  vocab.forEach(v => { if (v.src === SRC) s.add(v.lemma); });
  return s;
}
/* 给原文里已收录的词加上标记 */
function refreshMarks(){
  const set = vocabSavedSet();
  textEl.querySelectorAll('.w').forEach(w => {
    const hit = lookup(w.textContent);
    const lemma = hit ? hit[0] : w.textContent.toLowerCase();
    w.classList.toggle('saved', set.has(lemma));
  });
}
/* 取单词所在句子的英文原句 + 中文译文 */
function sentenceOf(el){
  const s = el.closest('.sent');
  if (!s) return { id:'', en:'', zh:'', para:0 };
  const id = s.dataset.id || '';
  const m = /^s(\d+)_(\d+)$/.exec(id);
  let zh = '', para = 0;
  if (m){
    para = +m[1];
    const p = DATA.paragraphs.find(x => String(x.idx) === m[1]);
    if (p && p.sentences[+m[2]]) zh = p.sentences[+m[2]].zh || '';
  }
  return { id, zh, para, en: s.textContent };
}
/* 收词 / 移除，返回最终是否已收录 */
function vocabToggle(w){
  const raw = w.textContent;
  const hit = lookup(raw);
  const lemma = hit ? hit[0] : raw.toLowerCase();
  const existing = vocabFind(lemma);
  if (existing){
    vocab = vocab.filter(v => v !== existing);
    vocabSave(); refreshMarks(); renderVocab();
    toast('已从生词本移除：' + raw);
    return false;
  }
  const s = sentenceOf(w);
  vocab.push({
    word: raw,
    lemma: lemma,
    gloss: hit ? hit[1] : '',
    context: s.en,
    zh: s.zh,
    para: s.para,
    sentId: s.id,
    src: SRC,
    ts: Date.now()
  });
  vocabSave(); refreshMarks(); renderVocab();
  toast('已收进生词本：' + raw);
  return true;
}

/* 抽屉渲染 */
const vbList = document.getElementById('vbList');
let vbFilter = '';
const pad2 = n => String(n).padStart(2, '0');
function fmtTime(ts){
  const d = new Date(ts);
  if (isNaN(d)) return '';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function hlContext(text, word){
  const safe = esc(text);
  const pat = esc(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try{
    return safe.replace(new RegExp('\\b(' + pat + ')\\b', 'i'), '<b>$1</b>');
  }catch(e){ return safe; }
}
function renderVocab(){
  const total = vocab.length;
  document.getElementById('vbCount').textContent = total + ' 条';
  const badge = document.getElementById('vbCountTop');
  badge.textContent = total;
  badge.classList.toggle('zero', total === 0);
  const foot = document.getElementById('vbFoot');
  if (vocabMemOnly){
    foot.innerHTML = '⚠ 当前浏览器禁用了本地存储，记录只存在内存里，刷新即丢失。<b>请及时用「导出 CSV」或「复制 JSON」带走。</b>';
  } else {
    foot.innerHTML = '暂存于本机浏览器（localStorage），不随文件走。换设备或清缓存前请先导出；后续接后端可直接拿「复制 JSON」的数据导入。';
  }

  const q = vbFilter.trim().toLowerCase();
  const list = vocab.slice()
    .sort((a, b) => (b.ts || 0) - (a.ts || 0))
    .filter(v => !q || (v.word + ' ' + v.lemma + ' ' + (v.gloss || '') + ' ' + (v.context || '')).toLowerCase().includes(q));

  if (!total){
    vbList.innerHTML = '<div class="vb-empty"><b>还没有生词</b>把鼠标停在原文的单词上，<br>点提示框里的「＋ 收进生词本」。</div>';
    return;
  }
  if (!list.length){
    vbList.innerHTML = '<div class="vb-empty">没有匹配「' + esc(vbFilter) + '」的词。</div>';
    return;
  }
  vbList.innerHTML = list.map(v => {
    const extra = (v.lemma && v.lemma !== String(v.word).toLowerCase()) ? '<span class="lm">' + esc(v.lemma) + '</span>' : '';
    return '<div class="vb-item">' +
      '<div><span class="wd">' + esc(v.word) + '</span>' + extra + '</div>' +
      '<div class="df">' + (v.gloss ? esc(v.gloss) : '（词典未收录，可自行补充）') + '</div>' +
      (v.context ? '<div class="cx">' + hlContext(v.context, v.word) + '</div>' : '') +
      '<div class="ft">' +
        (v.para ? '<span>第 ' + v.para + ' 段</span>' : '') +
        '<span class="src">' + esc(v.src || '') + '</span>' +

        '<button class="del" data-lemma="' + esc(v.lemma) + '" data-src="' + esc(v.src || '') + '">删除</button>' +
      '</div></div>';
  }).join('');
}

/* 导出 / 迁移 */
function download(name, text, type){
  const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function vocabRows(){
  const rows = [['word', 'lemma', 'translation', 'context', 'context_zh', 'paragraph', 'source', 'added_at']];
  vocab.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach(v => rows.push([
    v.word, v.lemma, v.gloss || '', v.context || '', v.zh || '', v.para || '',
    v.src || '', v.ts ? new Date(v.ts).toLocaleString('zh-CN') : ''
  ]));
  return rows;
}
document.getElementById('vbCsv').addEventListener('click', () => {
  if (!vocab.length) return toast('生词本还是空的');
  const csv = vocabRows().map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  download('生词本-' + (DATA.meta.test || '').replace(/\s+/g, '') + '-' + (DATA.meta.passage || '').replace(/\s+/g, '') + '.csv',
    '\ufeff' + csv, 'text/csv;charset=utf-8');
  toast('已导出 CSV（Excel 可直接打开）');
});
document.getElementById('vbJson').addEventListener('click', () => {
  if (!vocab.length) return toast('生词本还是空的');
  const json = JSON.stringify(vocab.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)), null, 2);
  const done = () => toast('已复制 JSON，可直接贴给后端/导入脚本');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(done).catch(() => fallbackCopy(json, done));
  } else {
    fallbackCopy(json, done);
  }
});
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  ta.remove();
  if (ok) return cb();
  download('生词本-' + (DATA.meta.test || '').replace(/\s+/g, '') + '-' + (DATA.meta.passage || '').replace(/\s+/g, '') + '.json',
    text, 'application/json;charset=utf-8');
  toast('浏览器不允许复制，已改为下载 JSON 文件');
}
document.getElementById('vbClear').addEventListener('click', () => {
  if (!vocab.length) return toast('生词本已经是空的');
  if (!confirm('确定清空生词本里的 ' + vocab.length + ' 条记录？清空后无法恢复。')) return;
  vocab = [];
  vocabSave(); refreshMarks(); renderVocab();
  toast('生词本已清空');
});

/* ---------- 单词悬停释义 + 收词 ---------- */
let tipWord = null;
let tipHideTimer = null;

function showTip(w){
  tipWord = w;
  const raw = w.textContent;
  const hit = lookup(raw);
  const lemma = hit ? hit[0] : raw.toLowerCase();
  const saved = !!vocabFind(lemma);
  tip.innerHTML = '<div class="tw">' + esc(raw) +
    (hit && lemma !== raw.toLowerCase() ? '<span class="tp">← ' + esc(lemma) + '</span>' : '') + '</div>' +
    '<div class="tg">' + (hit ? esc(hit[1]) : '（词典未收录，仍可先收进生词本）') + '</div>' +
    '<button class="tip-save' + (saved ? ' on' : '') + '" type="button">' +
      (saved ? '✓ 已在生词本 · 点击移除' : '＋ 收进生词本') + '</button>';
  tip.classList.add('show');
  const r = w.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2;
  let y = r.top - th - 9;
  if (y < 8) y = r.bottom + 9;
  x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
function hideTip(){
  tip.classList.remove('show');
  tipWord = null;
}
function syncTipBtn(saved){
  const b = tip.querySelector('.tip-save');
  if (!b) return;
  b.classList.toggle('on', saved);
  b.textContent = saved ? '✓ 已在生词本 · 点击移除' : '＋ 收进生词本';
}

textEl.addEventListener('mouseover', e => {
  const w = e.target.closest('.w');
  if (!w || w === tipWord) return;
  clearTimeout(tipHideTimer);
  showTip(w);
});
textEl.addEventListener('mouseout', e => {
  if (!e.target.closest('.w')) return;
  clearTimeout(tipHideTimer);
  tipHideTimer = setTimeout(hideTip, 220);
});
tip.addEventListener('mouseenter', () => clearTimeout(tipHideTimer));
tip.addEventListener('mouseleave', () => {
  clearTimeout(tipHideTimer);
  tipHideTimer = setTimeout(hideTip, 140);
});
tip.addEventListener('click', e => {
  if (!e.target.closest('.tip-save') || !tipWord) return;
  const now = vocabToggle(tipWord);
  syncTipBtn(now);
});
/* 点击空白处收掉浮层 */
document.addEventListener('click', e => {
  if (e.target.closest('.tip') || e.target.closest('#essay')) return;
  hideTip();
});

/* ---------- 右侧答案 ---------- */
const A = DATA;

function descHTML(i){
  const raw = (A.desc && A.desc[i]) || '';
  const body = raw.replace(/^Questions[^\n]*\n+/, '').trim();
  if (!body) return '';
  return '<div class="sect-desc">' + body.split('\n').filter(Boolean).map(esc).join('<br>') + '</div>';
}

const wrong = []
  .concat(A.mcq.filter(q => q.mine !== q.correct).map(q => q.no))
  .concat(A.summary.items.filter(q => q.mine !== q.correct).map(q => q.no))
  .concat(A.yn.filter(q => q.mine !== q.correct).map(q => q.no))
  .sort((a,b) => a-b);

/* 单题复盘块 */
function qrevHTML(no){
  const r = QR[no];
  if (!r) return '';
  let x = '<div class="qrev">';
  x += '<p class="qrev-d"><b>' + (r.label || '错在哪') + '</b>' + r.diag + '</p>';
  const cites = r.cites || [];
  if (cites.length){
    const ps = cites.map(c => c.p).filter((v, i, a) => a.indexOf(v) === i);
    x += '<p class="cite-j" data-p="' + cites[0].p + '" data-b="' + cites[0].b[0] + '" title="点一下滚到左栏">'
       + '原文出处 · 第 ' + ps.join('、') + ' 段<em>（左栏已加粗）</em></p>';
  }
  if (r.chain) x += '<p class="qrev-c"><b>正确链条</b>' + r.chain + '</p>';
  x += '</div>';
  return x;
}

function buildAnswers(){
  let h = '';

  h += '<div class="overview">';
  h += '<div class="ov-row"><span>篇目</span><b>' + A.meta.book + ' ' + A.meta.test + ' ' + A.meta.passage + '</b></div>';
  h += '<div class="ov-row"><span>用时 / 得分</span><b>' + A.meta.duration + ' · ' + A.meta.score + '</b></div>';
  h += '<div class="ov-wrong">错题 ' + wrong.length + ' 道：' + wrong.map(n => '<span>' + n + '</span>').join('') + '</div>';
  h += '</div>';

  /* 27–30 选择 */
  h += '<div class="sect"><div class="sect-t">选择题 · 27–30<span class="sect-tip">点题卡看复盘</span></div>' + descHTML(0);
  A.mcq.forEach(q => {
    const ok = q.mine === q.correct;
    h += '<div class="qcard qclick ' + (ok?'ok':'no') + '" data-q="' + q.no + '">';
    h += '<div class="qtop"><span class="qno">' + q.no + '</span><span class="tag ' + (ok?'ok':'no') + '">' + (ok?'正确':'错误') + '</span>' +
         '<span class="qmore">' + (ok?'为什么对':'复盘') + '<i>▾</i></span></div>';
    h += '<p class="stem">' + esc(q.stem) + '</p><ul class="opts">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (o.k === q.correct) cls += ' correct';
      if (o.k === q.mine && !ok) cls += ' mine-wrong';
      h += '<li class="' + cls + '"><i>' + o.k + '</i><span>' + esc(o.t) + '</span>' +
        (o.k === q.correct ? '<span class="mk">✓</span>' : (o.k === q.mine && !ok ? '<span class="mk">×</span>' : '')) + '</li>';
    });
    h += '</ul><div class="ansline">你选 <b class="' + (ok?'good':'bad') + '">' + q.mine + '</b> · 正确 <b class="good">' + q.correct + '</b></div>';
    h += qrevHTML(q.no);
    h += '</div>';
  });
  h += '</div>';

  /* 31–35 摘要填空 */
  h += '<div class="sect"><div class="sect-t">摘要填空 · 31–35<span class="sect-tip">点空号看复盘</span></div>' + descHTML(1);
  h += '<div class="sum-box">';
  h += '<p class="sum-t">' + esc(A.summary.title) + '</p>';
  h += '<p class="sum-text">' + esc(A.summary.text).replace(/\{\{(\d+)\}\}/g, (m, no) => {
    const it = A.summary.items.find(x => x.no === +no);
    const ok = it.mine === it.correct;
    const pm = {}; A.summary.options.forEach(o => pm[o.k] = o.t);
    const tipTxt = '你的答案：' + it.mine + ' ' + pm[it.mine] + (ok ? '' : '　正确答案：' + it.correct + ' ' + pm[it.correct]);
    return '<span class="blank ' + (ok?'ok':'no') + '" data-q="' + no + '" title="' + esc(tipTxt) + '"><b>' + no + '</b>' + it.mine +
      (ok ? '' : '<span class="arrow">→</span>' + it.correct) + '</span>';
  }) + '</p>';
  h += '<div class="optbox">';
  A.summary.options.forEach(o => {
    const hit = A.summary.items.some(i => i.correct === o.k);
    const mis = A.summary.items.some(i => i.mine === o.k && i.mine !== i.correct);
    h += '<div class="' + (hit ? 'hit' : (mis ? 'mis' : '')) + '"><em>' + o.k + '</em>' + esc(o.t) + '</div>';
  });
  h += '</div></div>';
  h += '<div class="qrev sum-rev" id="sumRev"></div>';
  h += '<div class="note-grp"><b>本组一验</b>' + REV.sum_note + '</div>';
  h += '</div>';

  /* 36–40 YNNG */
  h += '<div class="sect"><div class="sect-t">判断 YES / NO / NOT GIVEN · 36–40<span class="sect-tip">点题卡看复盘</span></div>' + descHTML(2);
  A.yn.forEach(q => {
    const ok = q.mine === q.correct;
    h += '<div class="qcard qclick ' + (ok?'ok':'no') + '" data-q="' + q.no + '">';
    h += '<div class="qtop"><span class="qno">' + q.no + '</span><span class="tag ' + (ok?'ok':'no') + '">' + (ok?'正确':'错误') + '</span>' +
         '<span class="qmore">' + (ok?'为什么对':'复盘') + '<i>▾</i></span></div>';
    h += '<p class="stem">' + esc(q.stem) + '</p>';
    h += '<div class="ynrow"><span class="chip-lbl">你选</span><span class="chip ' + (ok?'ok':'no') + '">' + q.mine + (ok ? ' ✓' : ' ×') + '</span>';
    h += '<span class="chip-lbl">正确</span><span class="chip ok">' + q.correct + '</span></div>';
    h += qrevHTML(q.no);
    h += '</div>';
  });
  h += '<div class="note-grp"><b>本组结论</b>' + REV.yn_diag + '</div>';
  h += '</div>';

  return h;
}

wledge which you have only recently acquired.", "j": "原文：“something <em>exciting</em> about passing on skills and knowledge that you yourself have just mastered – a certain <em>pride</em> and <em>zeal</em>”。exciting / pride / zeal 合起来就是 rewarding，这就是同义改写 → YES。你在等原词，把已经明说的话判成了“没提”。"}, {"no": 39, "mine": "NG", "correct": "N", "ok": false, "q": "The priority should be to ensure that the highest-achieving students attain their goals.", "j": "原文结尾：“we need the many to flourish – not suffer at the expense of a few bright stars.” 这是明确<em>反对</em>把少数尖子放在优先位置 → NO，不是 NG。"}, {"no": 40, "mine": "Y", "correct": "NG", "ok": false, "q": "Taking part in collaborative outdoor activities with teachers and classmates can improve student outcomes in the classroom.", "j": "徒步那段只写到“我们走完了——一起”，没有任何“因此课堂表现变好”的结论。你把“协作”这个共同点当成了因果，题干后半句（improve classroom outcomes）原文完全没有 → NG。"}], "yn_cites": [{"p": 6, "b": [4, 5]}, {"p": 9, "b": [2]}, {"p": 10, "b": [2]}, {"p": 11, "b": [1, 2, 6]}], "yn_diag": "四题错在四个方向：37、40 是<em>多推了一步</em>（把合理推测当成文中信息），38、39 是<em>少认了一步</em>（原文已经明说或已明确反对，却判了 NG）。方向相反，说明问题不在“我太爱推断”或“我太保守”，而在<em>判定那一步没有回原文找同一命题</em>——凭“读起来像不像”在答。", "bad": [{"n": "病灶 01", "t": "对象漂移", "p": "27、29、30 三题，题干问的分别是“目的、暗示、指代”，你答的都是段落里另一个更显眼的名词：莎士比亚合不合适 / 走错路的学生 / 学习目标。三题的正确项都锚在同一句的<em>主语</em>上，你锚在了修饰语上。"}, {"n": "病灶 02", "t": "搭配失守", "p": "32、33 短语找对了却挂错空。填空不是理解题，是<em>语法槽位题</em>：把空前两词＋空＋空后两词连读一遍，have bottom sets 立刻不通。这一步不做，找对短语也拿不到分。"}, {"n": "病灶 03", "t": "判定失据", "p": "37–40 四题全错，且两多两少、方向相反。真正的缺口是没有把题干压成一个命题（X 对 Y 做了什么），再回原文比对“成立 / 相反 / 不存在”。没有这一步，Y、N、NG 就变成手感。"}], "acts": ["<b>判断题先压命题再判</b>：把题干压成“谁 对 什么 做了什么”，回原文找同一个 X 和同一个 Y。找不到同一命题 → NG，无论作者“应该”怎么想。", "<b>同义改写要认账</b>：exciting / pride / zeal = rewarding，results in better outcomes = leads to higher achievements。判 Y 前先问“原文有没有等价表达”，不要等原词复现。", "<b>选择题先圈疑问词</b>：purpose / suggest / refer to 问的是功能、暗示、指代，不是内容对错。答完回头对一遍“我答的是不是它问的那一层”。", "<b>填空先过搭配闸</b>：空前两词＋空＋空后两词连读，语序或动宾不通立即划掉（have bottom sets ×，placed in the bottom sets ✓）。", "<b>同组查重</b>：无 NB 的题组答案必不重   });
  h += '</div>';

  h += '<div class="sec-h"><em>THE LOOP</em><h3>同一场徒步，他读了两次</h3></div>';
  h += '<div class="mn-echo">';
  h += '<div class="mn-col neg"><h4>第 4 段　反方的徒步</h4><p class="mn-q">' + MEANS.echoNeg + '</p></div>';
  h += '<div class="mn-col pos"><h4>第 11 段　作者的徒步</h4><p class="mn-q">' + MEANS.echoPos + '</p></div>';
  h += '</div>';
  h += '<div class="mn-echo-note">' + MEANS.echoNote + '</div>';

  h += '<div class="sec-h"><em>WHY IT FELT UNREADABLE</em><h3>四个机制，缺一不可</h3></div>';
  h += '<div class="mn-why">';
  MEANS.why.forEach((w, i) => {
    h += '<div><div class="k">0' + (i + 1) + '</div>'
       + '<div class="v"><b>' + w.t + '</b>' + w.p + '</div></div>';
  });
  h += '</div>';

  h += '<div class="mn-side">' + MEANS.side + '</div>';
  h += '<div class="rev-end">' + MEANS.end + '</div>';
  return h;
}


/* ---------- 每题复盘索引 ---------- */
const SUMNOTE = {
  31: '题干 leads to higher achievements 与原文 results in better outcomes 是同义改写，五个选项里没有第二个能对上，直接落 H。',
  32: 'bottom sets 该待的地方是 placed in the ___（被动、被分进去）。塞进 have ___ 就成了 “students have bottom sets”，动宾根本不通。另一个硬伤在 A：<em>wrong</em> 是评价词，原文通篇没出现过。',
  33: '这一空后面紧跟 backgrounds，能搭配的只有 disadvantaged。而且 bottom sets 已经用在 32 空——同一组答案不重复，两空互换是最典型的丢分方式。',
  34: 'those lucky clever students in the higher sets 就是 brightest pupils，原文甚至替你点明了 lucky clever。',
  35: '原文 teachers\' estimate … limits what the teacher feels the student is capable of，压成短语就是 lower expectations。'
};
const YNCITE = {
  36: [{p: 6, b: [4, 5]}],
  37: [{p: 9, b: [1, 2]}],
  38: [{p: 10, b: [2]}],
  39: [{p: 11, b: [1]}],
  40: [{p: 11, b: [2, 3, 4, 5, 6]}]
};

const QR = {};
REV.mcq.forEach(q => { QR[q.no] = {label: '错在哪', diag: q.diag, cites: q.cites, chain: q.chain}; });
if (REV.mcq_note) QR[28] = {label: '为什么对', diag: REV.mcq_note, cites: [{p: 3, b: [3]}], chain: ''};
REV.sum_rows.forEach(r => {
  QR[r.no] = {
    label: r.ok ? '为什么对' : '错在哪',
    diag: SUMNOTE[r.no] || '',
    cites: (r.no === 32 || r.no === 33) ? REV.sum_cites : [],
    chain: ''
  };
});
REV.yn_rows.forEach(r => {
  QR[r.no] = {label: r.ok ? '为什么对' : '错在哪', diag: r.j, cites: YNCITE[r.no] || [], chain: ''};
});

document.getElementById('answers').innerHTML = buildAnswers();
document.getElementById('review').innerHTML = revHTML();
document.getElementById('view-means').innerHTML = meansHTML();

/* ---------- 点题卡 → 展开复盘 + 原文标注 ---------- */
const answersEl = document.getElementById('answers');
const sumRevEl = document.getElementById('sumRev');
const essayEl = document.getElementById('essay');
let sumNo = 0;

function activeSources(){
  const out = [];
  document.querySelectorAll('.qcard.open[data-q]').forEach(c => out.push(+c.dataset.q));
  if (sumNo) out.push(sumNo);
  return out;
}

/* 只标注唯一打开的那一题；多题同时展开时不做标注 */
function openCites(){
  const keys = [], qs = [];
  const src = activeSources();
  if (src.length !== 1) return {keys, qs};
  const no = src[0], r = QR[no];
  if (!r) return {keys, qs};
  (r.cites || []).forEach(ci => ci.b.forEach(bi => { keys.push(ci.p + '_' + bi); qs.push(no); }));
  return {keys, qs};
}

function clearHL(){
  document.querySelectorAll('#text .sent.hl').forEach(e => e.classList.remove('hl'));
  document.querySelectorAll('#text .para.has-hl').forEach(e => e.classList.remove('has-hl'));
}

function paintHL(){
  clearHL();
  const {keys, qs} = openCites();
  if (!keys.length) return;
  keys.forEach((k, n) => {
    const el = document.querySelector('#text .sent[data-id="s' + k + '"]');
    if (!el) return;
    el.classList.add('hl');
    el.title = '第 ' + qs[n] + ' 题出处';
    const para = el.closest('.para');
    if (para) para.classList.add('has-hl');
  });
}

function scrollToCite(p, idx, force){
  const target = document.querySelector('#text .sent[data-id="s' + p + '_' + idx + '"]');
  if (!target) return;
  const essay = essayEl;
  const box = essay.getBoundingClientRect();
  const scrollable = essay.scrollHeight - essay.clientHeight > 8 && box.height > 240;
  if (!scrollable){
    /* 单栏堆叠：打开题卡时不拽走用户；但点「原文出处」是明确要求跳转 */
    if (force) target.scrollIntoView({behavior: 'smooth', block: 'center'});
    return;
  }
  const top = target.getBoundingClientRect().top - box.top + essay.scrollTop - box.height * 0.32;
  essay.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
}

function ensureVisible(el){
  const p = document.getElementById('panel');
  if (!el || p.scrollHeight - p.clientHeight < 8) return;
  const pb = p.getBoundingClientRect(), eb = el.getBoundingClientRect();
  if (eb.top >= pb.top + 6 && eb.bottom <= pb.bottom - 6) return;
  p.scrollTo({top: Math.max(0, p.scrollTop + (eb.top - pb.top) - 12), behavior: 'smooth'});
}

function revealCites(no){
  const r = QR[no];
  if (!r || !r.cites || !r.cites.length) return;
  scrollToCite(r.cites[0].p, r.cites[0].b[0]);
}

answersEl.addEventListener('click', e => {
  /* 摘要空号 */
  const blank = e.target.closest('.blank[data-q]');
  if (blank){
    const no = +blank.dataset.q;
    const same = sumNo === no;
    document.querySelectorAll('.qcard.open').forEach(c => c.classList.remove('open'));
    sumNo = same ? 0 : no;
    sumRevEl.classList.toggle('open', !same);
    sumRevEl.innerHTML = same ? '' : qrevHTML(no);
    document.querySelectorAll('.blank[data-q]').forEach(b => b.classList.toggle('on', !same && +b.dataset.q === no));
    paintHL();
    if (!same){ revealCites(no); ensureVisible(sumRevEl); }
    return;
  }

  /* 题卡：一次只开一张 */
  const card = e.target.closest('.qcard[data-q]');
  if (!card || e.target.closest('.qrev')) return;
  if (window.getSelection && String(window.getSelection()).length > 3) return;

  const was = card.classList.contains('open');
  document.querySelectorAll('.qcard.open').forEach(c => c.classList.remove('open'));
  if (sumNo){
    sumNo = 0;
    sumRevEl.classList.remove('open');
    sumRevEl.innerHTML = '';
    document.querySelectorAll('.blank.on').forEach(b => b.classList.remove('on'));
  }
  if (!was) card.classList.add('open');
  paintHL();
  if (!was){ revealCites(+card.dataset.q); ensureVisible(card); }
});

/* 点「原文出处」→ 滚到左栏那段 */
answersEl.addEventListener('click', e => {
  const c = e.target.closest('.cite-j[data-p]');
  if (!c) return;
  e.stopPropagation();
  scrollToCite(+c.dataset.p, +c.dataset.b || 0, true);
});

/* 跳到复盘 */

(function(){
  const btn = document.getElementById('btnRev');
  btn.addEventListener('click', () => {
    const on = btn.classList.toggle('on');
    document.querySelectorAll('.qcard[data-q]').forEach(c => c.classList.toggle('open', on));
    btn.textContent = on ? '收起复盘' : '展开复盘';
    paintHL();
    if (on){
      const first = document.querySelector('.qcard.open[data-q]');
      if (first) revealCites(+first.dataset.q);
    }
    tip.classList.remove('show');
  });
})();

/* 视图切换 */
const btnAll = document.getElementById('btnAll');
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    const v = t.dataset.v;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    document.getElementById('view-read').hidden = (v !== 'read');
    document.getElementById('view-means').hidden = (v !== 'means');
    btnAll.style.display = (v === 'read') ? '' : 'none';
    window.scrollTo({top: 0, behavior: 'instant'});
    tip.classList.remove('show');
  });
});

</script>
